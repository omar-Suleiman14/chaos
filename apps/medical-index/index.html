button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.site-header{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border)}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);font-size:16px;font-weight:650;letter-spacing:-.027em}
.brand svg{flex-shrink:0}
.brand .separator{width:1px;height:18px;background:var(--border);margin:0 2px}
.brand .index-label{font-size:13px;font-weight:510;color:var(--muted)}
.theme-toggle{display:flex;align-items:center;gap:8px;min-height:35px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;padding:7px 11px;font-size:12px}
.theme-toggle:hover{background:var(--hover);color:var(--text)}
.theme-toggle svg{width:15px;height:15px}
.content{padding:23px 0}
.tools{background:transparent;position:static;backdrop-filter:none;border:0;padding:0;margin:0 0 19px}
.search{width:100%;display:flex;align-items:center;gap:11px;min-height:43px;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 12px;color:var(--muted);transition:border-color .15s ease}
.search:focus-within{border-color:var(--focus)}
.search svg{width:16px;height:16px;flex-shrink:0}
.search input{width:100%;height:43px;background:transparent;outline:0;border:0;color:var(--text);font-size:13px;min-width:0}
.search input::placeholder{color:var(--faint)}
.filter-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}

.filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:5px;white-space:nowrap;padding:7px 10px;min-height:34px;font-size:11px;transition:background .15s ease,color .15s ease,border-color .15s ease}
.chip:hover{background:var(--hover);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--raised);border-color:var(--border-hover);color:var(--text);font-weight:620}
.chip .chip-dot{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--chip-accent,var(--faint));vertical-align:1px;margin-right:6px}
.chip[data-kind="lecture"]{--chip-accent:var(--lecture)}
.chip[data-kind="tutorial"]{--chip-accent:var(--tutorial)}
.chip[data-kind="practical"]{--chip-accent:var(--practical)}
.chip[data-kind="cbl"]{--chip-accent:var(--cbl)}
.chip[data-kind="exam"]{--chip-accent:var(--exam)}
.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:13px;flex-wrap:wrap}
.action-buttons{display:flex;gap:5px}
.action-button{background:transparent;border:0;color:var(--muted);padding:5px 8px;font-size:11px;border-radius:4px}
.action-button:hover{background:var(--hover);color:var(--text)}

.switch-track{width:32px;height:19px;background:var(--border);border:1px solid var(--border-hover);border-radius:99px;position:relative;display:inline-block;transition:background .19s ease,border-color .19s ease}

function extractNums(s,type){
 const re=type==="lecture"?/\b(?:lec(?:ture)?|l)\s*[.\s:_-]*([0-9]{1,2})(?:\s*(?:,|&|and|\/|[-–])\s*(?:l\s*)?([0-9]{1,2}))?/gi:type==="tutorial"?/\b(?:tutorial|tut)\s*[.\s:_-]*([0-9]{1,2})(?:\s*(?:,|&|\/|and|[-–])\s*([0-9]{1,2}))?/gi:/\b(?:pract(?:ical)?|section|p)\s*[.\s:_-]*([0-9]{1,2})(?:\s*(?:,|&|\/|and|[-–])\s*([0-9]{1,2}))?/gi;
 const nums=new Set();
 for(const m of s.matchAll(re)){const a=+m[1],b=m[2]?+m[2]:a;if(a<1||a>55||b<1||b>55)continue;if(Math.abs(a-b)<=5)for(let i=Math.min(a,b);i<=Math.max(a,b);i++)nums.add(i);else nums.add(a);}
 return [...nums];
}
function missingRows(items,type,sub){
 if(!["lecture","tutorial","practical"].includes(type))return [];
 const found=new Set();
 for(const x of items){for(const n of extractNums(x[4]+" "+x[5],type))found.add(n);}
 if(found.size<2)return [];
 const highest=Math.max(...found);if(highest>42)return [];
 const names={lecture:"Lecture",tutorial:"Tutorial",practical:"Practical"};
 const missing=[];for(let n=1;n<=highest;n++)if(!found.has(n))missing.push({missing:true,label:names[type]+" "+String(n).padStart(2,"0"),subject:sub,type});
 return missing;
}

 ];
 const topic=topics.find(([name,re])=>re.test(all))?.[0]||"";
 if(kind==="lecture"||kind==="tutorial"||kind==="practical"){

 }
 if(kind==="timetable"){

  return "Module Timetable";
 }
 if(kind==="exam"){
  const practical=/pract|ospe|osce|عملي/i.test(words), questions=/\b(?:questions?|mcq|bank|quiz|essay)\b|اسئل|أسئل|بنك|كويز/i.test(words);
  const ans=/answer|solutions?|اجاب|إجاب|محلول|مجاب/i.test(words);
  const forms=words.match(/\bform\s*([ab])\b|\bmid\s*([ab])\b/i);
  const form=forms?" — Form "+(forms[1]||forms[2]).toUpperCase():"";
  let title;
  if(practical&&questions)title="Practical Questions";
  else if(/(?:mid|midterm|mid-assessment|الميد)/i.test(words))title="Midterm Assessment"+form;
  else if(/(?:final|فاينل)/i.test(words))title="Final Examination"+form;
  else if(/(?:formative|تجريبي)/i.test(words))title="Formative Assessment"+form;
  else if(/(?:ospe|osce)/i.test(words))title="OSPE Examination"+form;
  else if(/(?:essay|written|ريتن)/i.test(words))title="Written Questions";
  else if(questions)title=/bank|بنك/i.test(words)?"Question Bank":"Practice Questions";
  else title="Exam Material"+form;
  if(ans&&!/answers?/i.test(title))title+=" — Answers";
  return title;
 }
 if(/(?:question|mcq|اسئل|أسئل|بنك)/i.test(words))return /pract|عملي/i.test(words)?"Practical Questions":"Practice Questions";
 if(/(?:anki|flashcard|\.apkg|\.colpkg)/i.test(words))return "Flashcards";
 if(/(?:slides?|شرائح|سلايد)/i.test(words))return "Slide Collection";

 if(/(?:review|revision|مراجع|مراجعة|تجميع|تلخيص|ملخص|summary)/i.test(words))return "Revision Notes";
 if(/(?:notes?|تأكيدات|تاكيدات)/i.test(words))return "Study Notes";
 if(/(?:book|كتاب)/i.test(words))return "Reference Material";
 const base=file.replace(/\.[a-z0-9]+$/i,"").replace(/[_-]+/g," ").replace(/\s+/g," ").trim();

 return "Study Resource";

changeTheme(initialTheme==="light"||initialTheme==="dark"?initialTheme:(systemDark?"dark":"light"));
themeButton.addEventListener("click",()=>{changeTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark")});
const CHEVRON='<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const QBY=new Map();
for(const item of Q){if(!QBY.has(item[1]))QBY.set(item[1],[]);QBY.get(item[1]).push(item)}
const SUBJECT_HINTS=[
 ["Anatomy",/\banatomy\b|\banat\b/i],["Histology",/\bhisto(?:logy)?\b/i],
 ["Physiology",/\bphysio(?:logy)?\b/i],["Biochemistry",/\bbiochem(?:istry)?\b|\bbio\b/i],
 ["Pathology",/\bpatho(?:logy)?\b/i],["Pharmacology",/\bpharma(?:cology)?\b/i],
 ["Microbiology",/\bmicro(?:biology)?\b/i],["Parasitology",/\bpara(?:sitology)?\b/i],
 ["Medicine",/\bmedicine\b/i],["Community Medicine",/\bcommunity\b/i]
];
function fileSubject(file){
 const s=displaySubject(file);
 if(s!=="General")return s;
 const title=file[4]+" "+file[5];
 for(const entry of SUBJECT_HINTS)if(entry[1].test(title))return entry[0];
 return s;
}
function quizMatches(quiz,file){
 if(quiz[1]!==file[1]||quiz[3]!==file[3])return false;
 if(quiz[2]!=="General"&&fileSubject(file)!==quiz[2])return false;
 const fileNums=extractNums(file[4]+" "+file[5],file[3]);
 const quizNums=quiz[4];
 if(fileNums.length&&quizNums.length)return quizNums.some(n=>fileNums.includes(n));
 return !fileNums.length&&!quizNums.length&&(file[3]==="practical"||file[3]==="cbl");
}
function matchingQuiz(file){
 if(!["lecture","tutorial","practical","cbl"].includes(file[3]))return null;
 const all=QBY.get(file[1])||[];
 const matches=all.filter(q=>quizMatches(q,file));
 if(!matches.length)return null;
 matches.sort((a,b)=>b[0]-a[0]);
 return matches[0];
}
function quizLabel(q){
 const nums=q[4],type=q[3],name=q[5].toLowerCase(),fmt=n=>String(n).padStart(2,"0");
 if(type==="lecture"||type==="tutorial"){
  const base=type==="lecture"?"Lecture":"Tutorial";
  return base+(nums.length?" "+nums.map(fmt).join(", "):"")+" — Questions";
 }
 if(type==="cbl")return "CBL"+(nums.length?" "+nums.map(fmt).join(", "):"")+" — Questions";
 if(type==="practical")return "Practical Questions";
 if(/formative/.test(name))return "Formative Exam";
 if(/final.bank|final bank/.test(name))return "Final Question Bank";
 if(/mid|assessment/.test(name))return "Midterm Questions";
 if(/final/.test(name))return "Final Questions";
 if(/bank/.test(name))return "Question Bank";
 return "Question Set";
}
function fileLine(file,usedQuiz){
 if(file.missing){
  return '<div class="material-row is-missing" data-kind="'+esc(file.type)+'"><span class="material-main"><span class="kind-mark"></span><span class="material-name">'+esc(file.label)+'</span><span class="material-chevron">—</span></span></div>';
 }
 const q=matchingQuiz(file);
 if(q)usedQuiz.add(q[0]);
 const title=academicTitle(file);
 const pdf='<a class="material-main" href="https://t.me/zatooona44/'+file[0]+'" target="_blank" rel="noopener noreferrer" aria-label="Open '+esc(title)+' PDF message"><span class="kind-mark"></span><span class="material-name">'+esc(title)+'</span><span class="material-chevron" aria-hidden="true">↗</span></a>';
 const question=q?'<a class="quiz-link" href="https://t.me/medics_44_mcq/'+q[0]+'" target="_blank" rel="noopener noreferrer" title="'+esc(q[5])+'">Questions</a>':"";
 return '<div class="material-row" data-kind="'+esc(file[3])+'">'+pdf+question+'</div>';
}
function matchesFile(file){
 if(kind!=="all"&&file[3]!==kind)return false;
 const str=norm(query.trim());
 return !str||norm(file[4]+" "+file[5]+" "+fileSubject(file)+" "+M[file[1]][0]+" "+academicTitle(file)).includes(str);
}
function matchesQuiz(q){
 if(kind!=="all"&&q[3]!==kind)return false;
 const str=norm(query.trim());
 return !str||norm(q[5]+" "+q[2]+" "+M[q[1]][0]+" "+quizLabel(q)).includes(str);
}
function visibleFiles(i){return D.filter(x=>x[1]===i&&matchesFile(x))}
function visibleQuiz(i){return (QBY.get(i)||[]).filter(matchesQuiz)}
function groupContent(i,files,questionPosts){
 const subMap=new Map();
 function add(s){if(!subMap.has(s))subMap.set(s,{files:[],quizzes:[]});return subMap.get(s)}
 for(const x of files)add(fileSubject(x)).files.push(x);
 for(const quiz of questionPosts)add(quiz[2]).quizzes.push(quiz);
 const subjects=[...subMap.keys()].sort((a,b)=>a==="General"?1:b==="General"?-1:a.localeCompare(b));
 const usedQuiz=new Set();
 return subjects.map(subject=>{
  const set=subMap.get(subject),grouped=new Map();
  for(const f of set.files){if(!grouped.has(f[3]))grouped.set(f[3],[]);grouped.get(f[3]).push(f)}
  let groups=TORDER.map(type=>{
   const items=grouped.get(type);if(!items)return "";
   const gaps=(showMissing&&!query.trim())?missingRows(items,type,subject):[];
   const records=items.map(x=>({v:x,n:extractNums(x[4]+" "+x[5],type)[0]||999}))
    .concat(gaps.map(x=>({v:x,n:Number(x.label.match(/\d+/)?.[0]||999)})));
   records.sort((a,b)=>a.n-b.n||(Number(a.v[0])||0)-(Number(b.v[0])||0));
   return '<div class="group-name">'+esc(LABELS[type])+'</div><div class="material-list">'+records.map(x=>fileLine(x.v,usedQuiz)).join("")+'</div>';
  }).join("");
  const extras=set.quizzes.filter(q=>!usedQuiz.has(q[0]));
  if(extras.length){
   groups+='<div class="group-name">Additional Questions</div><div class="quiz-grid">'+extras.map(q=>'<a class="quiz-extra" href="https://t.me/medics_44_mcq/'+q[0]+'" target="_blank" rel="noopener noreferrer" title="'+esc(q[5])+'"><span class="question-dot"></span><span>'+esc(quizLabel(q))+'</span><span class="end">↗</span></a>').join("")+'</div>';
  }
  return '<section class="subject"><h3 class="subject-name">'+esc(subject)+'</h3>'+groups+'</section>';
 }).join("");
}
function setPanel(b,panel,expand){
 b.setAttribute("aria-expanded",String(expand));
 panel.classList.toggle("collapsed",!expand);
 panel.setAttribute("aria-hidden",String(!expand));
 panel.inert=!expand;
}
function toggleYear(year){
 const b=document.querySelector('[data-year="'+year+'"]'),panel=document.getElementById("year-panel-"+year);
 if(!b||!panel)return;
 const next=b.getAttribute("aria-expanded")!=="true";
 if(next)openYears.add(year);else openYears.delete(year);
 save(OPEN_YEAR_KEY,[...openYears]);
 setPanel(b,panel,next);
}
function toggleModule(i){
 const b=document.querySelector('[data-module="'+i+'"]'),panel=document.getElementById("module-panel-"+i);
 if(!b||!panel)return;
 const next=b.getAttribute("aria-expanded")!=="true";
 if(next)openModules.add(i);else openModules.delete(i);
 save(OPEN_MODULE_KEY,[...openModules]);
 if(next){
  const inner=panel.querySelector(".module-contents");
  if(inner&&!inner.dataset.rendered){
   inner.innerHTML=groupContent(i,visibleFiles(i),visibleQuiz(i));
   inner.dataset.rendered="yes";
  }
 }
 setPanel(b,panel,next);
}
function moduleHTML(i,files,quizzes,searching){
 const expanded=searching||openModules.has(i);
 return '<section class="module"><button class="module-button" data-module="'+i+'" type="button" aria-expanded="'+expanded+'" aria-controls="module-panel-'+i+'">'+esc(M[i][0])+CHEVRON+'</button><div class="accordion-panel'+(expanded?"":" collapsed")+'" id="module-panel-'+i+'" aria-hidden="'+(!expanded)+'" '+(expanded?"":"inert")+'><div class="accordion-inner module-contents" '+(expanded?'data-rendered="yes"':'')+'>'+(expanded?groupContent(i,files,quizzes):"")+'</div></div></section>';
}
function render(){
 filterHost.innerHTML=TYPES.map(p=>'<button type="button" class="chip" data-kind="'+p[0]+'" data-filter="'+p[0]+'" aria-pressed="'+(kind===p[0])+'">'+(p[0]==="all"?"":'<span class="chip-dot"></span>')+esc(p[1])+'</button>').join("");
 const searching=!!query.trim();
 let n=0;
 const years=[1,2,3].map(year=>{
  const modules=M.map((m,i)=>m[1]===year?{i,files:visibleFiles(i),questions:visibleQuiz(i)}:null).filter(x=>x&&(x.files.length||x.questions.length));
  if(!modules.length)return "";
  n+=modules.reduce((sum,x)=>sum+x.files.length+x.questions.length,0);
  const expanded=searching||openYears.has(year);
  return '<section class="year"><button class="year-button" type="button" data-year="'+year+'" aria-expanded="'+expanded+'" aria-controls="year-panel-'+year+'"><span>Year '+year+'</span>'+CHEVRON+'</button><div class="accordion-panel'+(expanded?"":" collapsed")+'" id="year-panel-'+year+'" aria-hidden="'+(!expanded)+'" '+(expanded?"":"inert")+'><div class="accordion-inner year-contents">'+modules.map(x=>moduleHTML(x.i,x.files,x.questions,searching)).join("")+'</div></div></section>';
 }).join("");
 resultLabel.textContent=searching?n+" results":"";
 view.innerHTML=years||'<div class="empty">No matching materials or questions.</div>';
}
document.body.addEventListener("click",e=>{
 const y=e.target.closest("[data-year]");if(y){toggleYear(Number(y.dataset.year));return;}
 const m=e.target.closest("[data-module]");if(m){toggleModule(Number(m.dataset.module));return;}
 const f=e.target.closest("[data-filter]");if(f){kind=f.dataset.filter;render();}
});
document.getElementById("expandAll").addEventListener("click",()=>{
 [1,2,3].forEach(y=>openYears.add(y));
 M.forEach((_,i)=>openModules.add(i));
 save(OPEN_YEAR_KEY,[...openYears]);save(OPEN_MODULE_KEY,[...openModules]);render();
});
document.getElementById("collapseAll").addEventListener("click",()=>{
 openYears.clear();openModules.clear();
 save(OPEN_YEAR_KEY,[]);save(OPEN_MODULE_KEY,[]);render();
});
missingInput.addEventListener("change",()=>{
 showMissing=missingInput.checked;
 try{localStorage.setItem(MISSING_KEY,String(showMissing))}catch(_){}
 render();
});
qInput.addEventListener("input",()=>{query=qInput.value;render()});
document.addEventListener("keydown",e=>{
 const field=document.activeElement&&["INPUT","TEXTAREA"].includes(document.activeElement.tagName);
 if(e.key==="/"&&!field&&!e.metaKey&&!e.ctrlKey){e.preventDefault();qInput.focus()}
 else if(e.key==="Escape"&&document.activeElement===qInput){qInput.value="";query="";qInput.blur();render()}
});
render();
})();</script></body></html>
