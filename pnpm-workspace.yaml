allowBuilds:
  '@clerk/shared': true
  core-js: false
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.0'
  - '@next/eslint-plugin-next@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - next@16.4.0
# Security advisories in transitive runtime dependencies (docs/dependency-advisories.md).
overrides:
  dompurify@<3.4.17: ^3.4.17
  hono@<4.13.16: ^4.13.16
  ip-address@>=10.0.0 <10.7.4: ^10.7.4
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  qs@>=6.0.0 <6.16.1: ^6.16.1
  shell-quote@>=1.0.0 <1.11.0: ^1.11.0
  proxy-addr@<2.0.8: ^2.0.8
  source-map-js@<1.2.2: ^1.2.2
  katex@<0.18.2: ^0.19.0
