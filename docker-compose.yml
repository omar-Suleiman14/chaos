# Chaos self-hosting stack: Next.js app + official self-hosted Convex backend
# and dashboard. See docs/self-hosting.md. Quick start:
#   cp .env.example .env    # then edit it
#   docker compose up -d --build
#   docker compose exec backend ./generate_admin_key.sh   # put the key in .env
#   docker compose --profile deploy run --rm convex-deploy
name: chaos

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:${CONVEX_BACKEND_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${CONVEX_API_PORT:-3210}:3210" # client API and websocket
      - "${CONVEX_SITE_PORT:-3211}:3211" # HTTP actions (/api/*, webhooks, MCP)
    volumes:
      - convex-data:/convex/data
    environment:
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-chaos-self-hosted}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?set CONVEX_INSTANCE_SECRET in .env}
      # Public URLs that browsers use to reach the backend. Must match the
      # NEXT_PUBLIC_CONVEX_URL / NEXT_PUBLIC_CONVEX_SITE_URL the app was built with.
      CONVEX_CLOUD_ORIGIN: ${NEXT_PUBLIC_CONVEX_URL:?set NEXT_PUBLIC_CONVEX_URL in .env}
      CONVEX_SITE_ORIGIN: ${NEXT_PUBLIC_CONVEX_SITE_URL:?set NEXT_PUBLIC_CONVEX_SITE_URL in .env}
      # Only for plain-http local trials. Remove once you terminate TLS.
      DO_NOT_REQUIRE_SSL: ${CONVEX_DO_NOT_REQUIRE_SSL:-}
      # Optional: use Postgres/MySQL instead of the bundled SQLite.
      DATABASE_URL: ${CONVEX_DATABASE_URL:-}
      RUST_LOG: ${CONVEX_RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      start_period: 10s
      timeout: 5s
      retries: 10

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_DASHBOARD_TAG:-latest}
    restart: unless-stopped
    ports:
      # Admin UI. Bind to localhost by default; it is protected only by the admin key.
      - "${CONVEX_DASHBOARD_BIND:-127.0.0.1}:${CONVEX_DASHBOARD_PORT:-6791}:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${NEXT_PUBLIC_CONVEX_URL}
    depends_on:
      backend:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL}
        NEXT_PUBLIC_CONVEX_SITE_URL: ${NEXT_PUBLIC_CONVEX_SITE_URL}
        NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-clerk}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_SOURCE_REPO_URL: ${NEXT_PUBLIC_SOURCE_REPO_URL:-}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    image: chaos-app:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CHAOS_MCP_SECRET: ${CHAOS_MCP_SECRET:-}
      CHAOS_MCP_CLIENT_IDS: ${CHAOS_MCP_CLIENT_IDS:-}
      OPENAI_APPS_CHALLENGE_TOKEN: ${OPENAI_APPS_CHALLENGE_TOKEN:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      # Server-side calls stay on the compose network.
      CONVEX_SITE_URL: http://backend:3211
    depends_on:
      backend:
        condition: service_healthy

  # One-shot: pushes convex/ functions and deployment env vars to the backend.
  # Run it after the first `up` and after every upgrade, before/with the new app:
  #   docker compose --profile deploy run --rm convex-deploy
  convex-deploy:
    profiles: ["deploy"]
    build:
      context: .
      target: convex-deploy
    # Reaches the backend over the compose network (the public URL may be an
    # https hostname the container cannot resolve).
    environment:
      CONVEX_SELF_HOSTED_URL: http://backend:3210
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-} # checked by docker/convex-deploy.sh
      CLERK_JWT_ISSUER_DOMAIN: ${CLERK_JWT_ISSUER_DOMAIN:-}
      CHAOS_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-clerk}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      CHAOS_APP_URL: ${CHAOS_APP_URL:-${NEXT_PUBLIC_APP_URL:-}}
      CHAOS_MCP_SECRET: ${CHAOS_MCP_SECRET:-}
      CHAOS_SUPPORT_EMAIL: ${CHAOS_SUPPORT_EMAIL:-${NEXT_PUBLIC_SUPPORT_EMAIL:-}}
      CHAOS_WEBHOOK_KEY: ${CHAOS_WEBHOOK_KEY:-}
      CHAOS_WEBHOOK_ALLOW_LOCALHOST: ${CHAOS_WEBHOOK_ALLOW_LOCALHOST:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      CHAOS_API_READ_RATE_PER_MINUTE: ${CHAOS_API_READ_RATE_PER_MINUTE:-}
      CHAOS_API_WRITE_RATE_PER_MINUTE: ${CHAOS_API_WRITE_RATE_PER_MINUTE:-}
      CI: "1"
    depends_on:
      backend:
        condition: service_healthy


volumes:
  convex-data:
