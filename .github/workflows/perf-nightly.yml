name: Nightly performance

# Every night against main: the large-form and giant-lesson benchmarks, render
# census, stylesheet and bundle budgets (with timings gated, which PR runs do
# not do), the MCP regression suites, and the Chromium journeys, keystrokes,
# layout shift and memory against the E2E environment. When anything fails
# it opens an issue labelled `perf-nightly`, or comments on the open one; the
# first green night after that closes it.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-nightly
  cancel-in-progress: false

jobs:
  budgets:
    name: Large forms, giant lesson, census, CSS and bundles
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Correctness before speed: lost answers, exposed drafts and stale or deleted
      # content fail the run whatever the numbers say (perf/results/correctness.json).
      - name: Correctness checks
        run: pnpm test:correctness
        continue-on-error: true

      # Measurements first; the ratchet fails the job if any suite failed.
      - name: Measure Convex reads and client rendering
        run: pnpm perf
        continue-on-error: true

      - name: Measure stylesheet costs
        run: pnpm perf:css
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://ci-placeholder.convex.cloud"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k"
          CLERK_SECRET_KEY: "sk_test_ci-placeholder-not-a-real-credential"

      - name: Measure bundles
        run: pnpm perf:bundles

      - name: Compare with budgets
        run: pnpm perf:check

      - name: Summary
        if: always()
        run: cat perf/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-budgets
          path: perf/results
          retention-days: 30

  mcp:
    name: MCP end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tool inventory and schema snapshot
        run: pnpm mcp:inventory:check

      # A real MCP client over the server's transport, against the full Convex backend.
      - name: MCP suites and large lessons
        run: pnpm exec vitest run --config vitest.integration.config.mts mcp Mcp largeLessons

  browser:
    name: Journeys, keystrokes, layout and memory
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_CONVEX_ENV: ${{ secrets.E2E_CONVEX_ENV }}
      E2E_CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
      E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
      E2E_AUTH_PROVIDER: ${{ vars.E2E_AUTH_PROVIDER || 'clerk' }}
      E2E_PERF_FORM_ID: ${{ vars.E2E_PERF_FORM_ID }}
      E2E_PERF_COURSE_ID: ${{ vars.E2E_PERF_COURSE_ID }}
      E2E_PERF_LESSON_ID: ${{ vars.E2E_PERF_LESSON_ID }}
      E2E_PERF_GIANT_LESSON_ID: ${{ vars.E2E_PERF_GIANT_LESSON_ID }}
      E2E_PERF_QUIZ_SHARE_ID: ${{ vars.E2E_PERF_QUIZ_SHARE_ID }}
      E2E_PERF_LIVE_PIN: ${{ vars.E2E_PERF_LIVE_PIN }}
      E2E_PERF_LARGE_FORM_ID: ${{ vars.E2E_PERF_LARGE_FORM_ID }}
      PERF_RUNS: "5"
      PERF_RENDER_RUNS: "3"
    steps:
      - name: E2E environment configured
        id: env
        run: |
          if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
            echo "E2E_BASE_URL is not set: browser journeys skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.env.outputs.ready == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        if: steps.env.outputs.ready == 'true'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        if: steps.env.outputs.ready == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: steps.env.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.env.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Measure journeys, keystrokes and render health
        if: steps.env.outputs.ready == 'true'
        run: pnpm exec playwright test -c playwright.perf.config.ts

      - name: Compare with budgets
        if: always() && steps.env.outputs.ready == 'true'
        run: pnpm perf:check -- --suites journeys-browser,keystroke-browser,render-browser,idle-browser,memory-browser --allow-new

      - name: Summary
        if: always() && steps.env.outputs.ready == 'true'
        run: cat perf/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always() && steps.env.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-browser
          path: |
            perf/results
            test-results
          retention-days: 30

  report:
    name: Open or close the issue
    needs: [budgets, mcp, browser]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULTS: "budgets: ${{ needs.budgets.result }}, mcp: ${{ needs.mcp.result }}, browser: ${{ needs.browser.result }}"
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Report
        run: |
          gh label create perf-nightly --color B60205 --description "Nightly performance run failed" 2>/dev/null || true
          open=$(gh issue list --label perf-nightly --state open --limit 1 --json number --jq '.[0].number // empty')
          day=$(date -u +%F)
          if [ "$FAILED" = "true" ]; then
            body=$(printf 'Nightly performance run on %s failed.\n\n%s\n\nRun, summaries and artifacts: %s' "$day" "$RESULTS" "$RUN_URL")
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
            else gh issue create --title "Nightly performance run failed" --label perf-nightly --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Green again on $day: $RUN_URL"
          fi
