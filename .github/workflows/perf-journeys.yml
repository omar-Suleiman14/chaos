name: Browser journeys, keystrokes and render health

# Real-browser timings for lib/journeys.ts against the dedicated E2E
# environment. Needs the same secrets as the core E2E smoke plus the
# E2E_PERF_* fixture ids (perf/README.md). Never points at production.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Samples per journey
        default: "5"

permissions:
  contents: read

jobs:
  journeys:
    name: Journey timings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_CONVEX_ENV: ${{ secrets.E2E_CONVEX_ENV }}
      E2E_CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
      E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
      E2E_AUTH_PROVIDER: ${{ vars.E2E_AUTH_PROVIDER || 'clerk' }}
      E2E_PERF_FORM_ID: ${{ vars.E2E_PERF_FORM_ID }}
      E2E_PERF_COURSE_ID: ${{ vars.E2E_PERF_COURSE_ID }}
      E2E_PERF_LESSON_ID: ${{ vars.E2E_PERF_LESSON_ID }}
      E2E_PERF_QUIZ_SHARE_ID: ${{ vars.E2E_PERF_QUIZ_SHARE_ID }}
      E2E_PERF_LIVE_PIN: ${{ vars.E2E_PERF_LIVE_PIN }}
      E2E_PERF_LARGE_FORM_ID: ${{ vars.E2E_PERF_LARGE_FORM_ID }}
      PERF_RUNS: ${{ inputs.runs || '5' }}
      PERF_RENDER_RUNS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Measure journeys and render health
        run: pnpm exec playwright test -c playwright.perf.config.ts

      - name: Compare with budgets
        if: always()
        run: pnpm perf:check -- --suites journeys-browser,keystroke-browser,render-browser --allow-new

      - name: Summary
        if: always()
        run: cat perf/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-results
          path: |
            perf/results
            test-results
          retention-days: 30
