name: Feature flag expiry

# Every Monday: flags in lib/flags.ts that expired or expire within 14 days.
# Findings open one issue labelled flag-cleanup (or comment on it); a clean
# week closes it. Pull requests run the same check in CI without failing on
# expiry (pnpm flags:check -- --ci).
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expiry:
    name: Expired and expiring flags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check flags
        id: check
        run: pnpm flags:check
        continue-on-error: true

      - name: Summary
        if: always()
        run: cat perf/results/flags.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open or close the issue
        if: always()
        run: >
          pnpm exec tsx scripts/check-report.ts --key flag-cleanup
          --title "Feature flags due for cleanup" --label flag-cleanup
          --failed "${{ steps.check.outcome == 'failure' }}"
          --body-file perf/results/flags.md
