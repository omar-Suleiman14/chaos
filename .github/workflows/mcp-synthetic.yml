name: MCP synthetic check

# Every 6 hours against production (and staging when STAGING_MCP_URL is set):
# deployed tool list vs the repository snapshot, authenticated reads with
# response schemas checked, an isolated create → delete → archive in the
# synthetic account, and p50/p75/p95 latency compared with
# perf/baselines/mcp-synthetic.json. A failure or regression opens one issue
# (label production-health) or comments on it; the next green run closes it.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-synthetic
  cancel-in-progress: false

jobs:
  synthetic:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: production, url_var: PRODUCTION_MCP_URL, token_secret: MCP_SYNTHETIC_TOKEN }
          - { name: staging, url_var: STAGING_MCP_URL, token_secret: STAGING_MCP_SYNTHETIC_TOKEN }
    env:
      MCP_SYNTHETIC_URL: ${{ vars[matrix.target.url_var] || (matrix.target.name == 'production' && 'https://chaos.fail/mcp' || '') }}
      MCP_SYNTHETIC_TOKEN: ${{ secrets[matrix.target.token_secret] }}
      MCP_SYNTHETIC_SAMPLES: "7"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Target configured
        id: env
        run: |
          if [ -z "$MCP_SYNTHETIC_URL" ] || [ -z "$MCP_SYNTHETIC_TOKEN" ]; then
            echo "${{ matrix.target.name }}: URL or token not configured, skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.env.outputs.ready == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        if: steps.env.outputs.ready == 'true'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        if: steps.env.outputs.ready == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.env.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Synthetic check
        id: check
        if: steps.env.outputs.ready == 'true'
        run: pnpm mcp:synthetic
        continue-on-error: true

      # Latency gates with a 50% band (perf/baselines/mcp-synthetic.json); a missing baseline proposes one.
      - name: Compare latency with baseline
        id: latency
        if: steps.env.outputs.ready == 'true'
        run: pnpm perf:check -- --suites mcp-synthetic --allow-new
        continue-on-error: true

      - name: Summary
        if: always() && steps.env.outputs.ready == 'true'
        run: |
          cat perf/results/mcp-synthetic.md >> "$GITHUB_STEP_SUMMARY" || true
          cat perf/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cat perf/results/mcp-synthetic.md perf/results/summary.md > perf/results/report.md 2>/dev/null || true

      - name: Open or close the issue
        if: always() && steps.env.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: >
          pnpm exec tsx scripts/check-report.ts --key "mcp-synthetic-${{ matrix.target.name }}"
          --title "MCP synthetic check failing (${{ matrix.target.name }})" --label production-health
          --failed "${{ steps.check.outcome == 'failure' || steps.latency.outcome == 'failure' }}"
          --body-file perf/results/report.md

      - name: Upload results
        if: always() && steps.env.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-synthetic-${{ matrix.target.name }}
          path: perf/results
          retention-days: 90
