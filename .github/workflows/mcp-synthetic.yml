name: MCP synthetic check

# Verify the deployed MCP after a successful production deployment. It can
# also be run manually; there is no periodic six-hour poll.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-synthetic
  cancel-in-progress: false

jobs:
  synthetic:
    name: Production MCP
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      MCP_SYNTHETIC_URL: ${{ vars.PRODUCTION_MCP_URL || 'https://chaos.fail/mcp' }}
      MCP_SYNTHETIC_TOKEN: ${{ secrets.MCP_SYNTHETIC_TOKEN }}
      MCP_SYNTHETIC_SAMPLES: "7"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Target configured
        id: env
        run: |
          if [ -z "$MCP_SYNTHETIC_TOKEN" ]; then
            echo "MCP_SYNTHETIC_TOKEN is not configured: skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.env.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        if: steps.env.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Setup Node
        if: steps.env.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: steps.env.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Synthetic check
        id: check
        if: steps.env.outputs.ready == 'true'
        run: pnpm mcp:synthetic
        continue-on-error: true

      - name: Compare latency with baseline
        id: latency
        if: steps.env.outputs.ready == 'true'
        run: pnpm perf:check -- --suites mcp-synthetic --allow-new
        continue-on-error: true

      - name: Summary
        if: always() && steps.env.outputs.ready == 'true'
        run: |
          cat perf/results/mcp-synthetic.md >> "$GITHUB_STEP_SUMMARY" || true
          cat perf/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cat perf/results/mcp-synthetic.md perf/results/summary.md > perf/results/report.md 2>/dev/null || true

      - name: Open or close the issue
        if: always() && steps.env.outputs.ready == 'true'
        run: >
          pnpm exec tsx scripts/check-report.ts --key "mcp-synthetic-production"
          --title "MCP synthetic check failing (production)" --label production-health
          --failed "${{ steps.check.outcome == 'failure' || steps.latency.outcome == 'failure' }}"
          --body-file perf/results/report.md

      - name: Upload results
        if: always() && steps.env.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-synthetic-production
          path: perf/results
          retention-days: 30
