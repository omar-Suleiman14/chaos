name: CI

# Pull requests gate merges. The resulting combined main commit is checked too:
# individually passing PRs cannot prove that sequential merges work together.
# Docs-only PRs skip tests and build; a skipped required job counts as passing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          code_files=$(printf '%s\n' "$files" | grep -Ev '^(docs/.*\.md|[^/]+\.md|LICENSE|\.github/ISSUE_TEMPLATE/.*|\.github/PULL_REQUEST_TEMPLATE\.md|\.github/CODEOWNERS)$' || true)
          if [ -n "$code_files" ]; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check MCP inventory and tool schema snapshot
        run: pnpm mcp:inventory:check

      - name: Check feature flag declarations
        run: pnpm flags:check -- --ci

      - name: Lint
        run: pnpm lint

      - name: Check unused code and dependencies
        run: pnpm knip:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Guard the performance harness
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}" --jq '[.labels[].name] | join(",")')
          PR_LABELS="$labels" pnpm perf:guard

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration

  build:
    name: Production build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://ci-placeholder.convex.cloud"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k"
          CLERK_SECRET_KEY: "sk_test_ci-placeholder-not-a-real-credential"
      # Deterministic performance budgets (Convex reads, render counts and CSS)
      # gate every pull request. Timings stay in the manual
      # perf.yml run. A raise needs `pnpm perf:ratchet raise` with a reason, which
      # the perf guard in Static checks enforces.
      - name: Measure Convex reads and client rendering
        run: pnpm perf
        continue-on-error: true
      - name: Measure stylesheet costs
        run: pnpm perf:css
        continue-on-error: true
      # Bundle sizes are not gated yet: `next build --webpack` does not write the
      # .next/diagnostics/route-bundle-stats.json that perf:bundles reads.
      - name: Compare with performance budgets
        run: pnpm perf:check --suites builderKeystroke,builderTabs,census,css,journeys,largeForms,surfaces
      - name: Performance summary
        if: always()
        run: cat perf/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

  better-auth-build:
    name: Better Auth build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build without Clerk
        run: pnpm build
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: "betterauth"
          NEXT_PUBLIC_CONVEX_URL: "https://ci-placeholder.convex.cloud"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
          CLERK_SECRET_KEY: ""
          NEXT_PUBLIC_APP_URL: "https://chaos.example.com"
          NEXT_PUBLIC_CONVEX_SITE_URL: "https://ci-placeholder.convex.site"

  docker:
    name: Docker image build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build app image
        run: >
          docker build --target runner -t chaos-app:ci
          --build-arg NEXT_PUBLIC_CONVEX_URL=http://127.0.0.1:3210
          --build-arg NEXT_PUBLIC_CONVEX_SITE_URL=http://127.0.0.1:3211
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k
          .
      - name: Build Convex deploy image
        run: docker build --target convex-deploy -t chaos-convex-deploy:ci .
      - name: Smoke test health endpoint
        run: |
          docker run -d --name chaos-smoke -p 3000:3000             -e CLERK_SECRET_KEY=sk_test_ci-placeholder-not-a-real-credential chaos-app:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          docker logs chaos-smoke
          exit 1
