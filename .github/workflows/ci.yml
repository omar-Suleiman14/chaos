name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job in this workflow needs to write to the repo,
# comment on a PR, or otherwise use the GITHUB_TOKEN for anything but
# checkout, so it stays at the least privilege the workflow needs.
permissions:
  contents: read

# A superseded run on the same PR/branch is wasted CI time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm

      # This is a `pull_request` (not `pull_request_target`) workflow, so a
      # fork PR runs against the fork's own code with no repository secrets
      # in scope — there are none to leak here regardless, since every value
      # below is a placeholder, never a real credential.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://ci-placeholder.convex.cloud"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k"
          CLERK_SECRET_KEY: "sk_test_ci-placeholder-not-a-real-credential"

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Builds the app image and the Convex deploy tool image with placeholder
      # public values (never real credentials) to catch Dockerfile and
      # standalone-output regressions. Nothing is pushed.
      - name: Build app image
        run: >
          docker build --target runner -t chaos-app:ci
          --build-arg NEXT_PUBLIC_CONVEX_URL=http://127.0.0.1:3210
          --build-arg NEXT_PUBLIC_CONVEX_SITE_URL=http://127.0.0.1:3211
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k
          .

      - name: Build Convex deploy image
        run: docker build --target convex-deploy -t chaos-convex-deploy:ci .

      - name: Smoke test health endpoint
        run: |
          docker run -d --name chaos-smoke -p 3000:3000 \
            -e CLERK_SECRET_KEY=sk_test_ci-placeholder-not-a-real-credential chaos-app:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          docker logs chaos-smoke
          exit 1
