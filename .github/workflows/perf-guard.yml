name: Performance harness guard

# Fast check on every pull request (no build, no benchmarks): a change to
# product code may not also change what measures it, and budgets only go up
# through perf-ratchet raise with a recorded reason (perf/README.md,
# "Protecting the harness"). The budgets themselves run nightly.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: perf-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Harness and budgets unchanged by the optimisation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      # Only tsx is needed; no full install.
      - name: Guard the performance harness
        run: npx --yes tsx@4 scripts/perf-guard.ts
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
