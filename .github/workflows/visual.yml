name: Visual regression

# Screenshot diffs are deliberately manual. Run this when a change is expected
# to affect the UI instead of rebuilding Chromium screenshots every night.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite
        type: choice
        options: [app, site]
        default: app
      mode:
        description: Compare with the baseline, or record a new one
        type: choice
        options: [compare, record]
        default: compare

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  visual:
    name: Screenshots (${{ inputs.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUITE: ${{ inputs.suite }}
      MODE: ${{ inputs.mode }}
      VISUAL_SUITE: ${{ inputs.suite }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure build
        run: |
          if [ "$SUITE" = app ]; then
            convex="${{ vars.VISUAL_CONVEX_URL }}"
            [ -n "$convex" ] || { echo "Set VISUAL_CONVEX_URL before running the app suite."; exit 1; }
            {
              echo "NEXT_PUBLIC_AUTH_PROVIDER=betterauth"
              echo "NEXT_PUBLIC_CONVEX_URL=$convex"
              echo "NEXT_PUBLIC_CONVEX_SITE_URL=${convex%.cloud}.site"
              echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
              echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="
              echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            } >> "$GITHUB_ENV"
          else
            {
              echo "NEXT_PUBLIC_CONVEX_URL=https://ci-placeholder.convex.cloud"
              echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k"
              echo "CLERK_SECRET_KEY=sk_test_ci-placeholder-not-a-real-credential"
            } >> "$GITHUB_ENV"
          fi

      - name: Build
        run: pnpm build

      - name: App fixtures
        if: env.SUITE == 'app'
        run: |
          {
            echo "E2E_CREATOR_EMAIL=${{ secrets.E2E_CREATOR_EMAIL }}"
            echo "E2E_CREATOR_PASSWORD=${{ secrets.E2E_CREATOR_PASSWORD }}"
            echo "E2E_AUTH_PROVIDER=betterauth"
            echo "E2E_PERF_FORM_ID=${{ vars.E2E_PERF_FORM_ID }}"
            echo "E2E_PERF_COURSE_ID=${{ vars.E2E_PERF_COURSE_ID }}"
            echo "E2E_PERF_LESSON_ID=${{ vars.E2E_PERF_LESSON_ID }}"
            echo "E2E_VISUAL_FORMS=${{ vars.E2E_VISUAL_FORMS }}"
          } >> "$GITHUB_ENV"

      - name: Fetch baseline
        if: env.MODE == 'compare'
        run: |
          for run_id in $(gh run list --workflow visual.yml --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run_id" --name "visual-baseline-$SUITE" --dir tests/visual/__screenshots__ 2>/dev/null; then
              echo "Comparing with the baseline from run $run_id." >> "$GITHUB_STEP_SUMMARY"
              echo "BASELINE=1" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No baseline yet: this run records one instead of comparing." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare
        id: compare
        if: env.MODE == 'compare' && env.BASELINE == '1'
        run: pnpm exec playwright test -c playwright.visual.config.ts

      - name: Record
        if: env.MODE == 'record' || env.BASELINE != '1'
        run: pnpm exec playwright test -c playwright.visual.config.ts --update-snapshots=all
        env:
          VISUAL_RECORD: "1"

      - name: Upload baseline
        if: env.MODE == 'record' || env.BASELINE != '1' || steps.compare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baseline-${{ env.SUITE }}
          path: tests/visual/__screenshots__
          retention-days: 90

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-report-${{ env.SUITE }}
          path: |
            playwright-report/visual
            test-results
          retention-days: 14
