name: Visual regression

# Screenshot diffs, desktop and mobile, light and dark (tests/visual).
#
# Nightly, not on every push: screenshots are too slow to gate each deploy.
# site: each night builds main and compares the public pages with the baseline
#   from the latest successful run (artifact `visual-baseline-site`), then
#   carries that baseline forward. A night with no baseline records one. After
#   an intended look change, run it manually with `record`. Baselines are never
#   committed, so every image comes from this same Linux runner.
# app: each major form theme, cards and Live (plus lesson, course, dashboard and
#   editor when their fixtures and the test login are configured), from this
#   branch's build pointed at the dev Convex deployment (vars.VISUAL_CONVEX_URL),
#   never production. Manual: `record` stores a baseline, `compare` checks
#   against the last recorded one.
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite
        type: choice
        options: [app, site]
        default: app
      mode:
        description: Compare with the baseline, or record a new one
        type: choice
        options: [compare, record]
        default: compare

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-${{ github.ref }}-${{ inputs.suite || 'site' }}
  cancel-in-progress: true

jobs:
  visual:
    name: Screenshots (${{ inputs.suite || 'site' }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUITE: ${{ inputs.suite || 'site' }}
      MODE: ${{ inputs.mode || 'compare' }}
      VISUAL_SUITE: ${{ inputs.suite || 'site' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Written to the job environment so `pnpm start` runs with exactly what was built.
      # site: no backend; marketing pages never touch auth.
      # app: the dev Convex deployment with Chaos's own sign-in instead of Clerk, which
      # would need a real secret key on the server for every app page.
      - name: Configure build
        run: |
          if [ "$SUITE" = app ]; then
            convex="${{ vars.VISUAL_CONVEX_URL }}"
            [ -n "$convex" ] || { echo "Set the VISUAL_CONVEX_URL repository variable (dev Convex URL)."; exit 1; }
            {
              echo "NEXT_PUBLIC_AUTH_PROVIDER=betterauth"
              echo "NEXT_PUBLIC_CONVEX_URL=$convex"
              echo "NEXT_PUBLIC_CONVEX_SITE_URL=${convex%.cloud}.site"
              echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
              echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="
              echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            } >> "$GITHUB_ENV"
          else
            {
              echo "NEXT_PUBLIC_CONVEX_URL=https://ci-placeholder.convex.cloud"
              echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k"
              echo "CLERK_SECRET_KEY=sk_test_ci-placeholder-not-a-real-credential"
            } >> "$GITHUB_ENV"
          fi

      - name: Build
        run: pnpm build

      - name: App fixtures
        if: env.SUITE == 'app'
        run: |
          {
            echo "E2E_CREATOR_EMAIL=${{ secrets.E2E_CREATOR_EMAIL }}"
            echo "E2E_CREATOR_PASSWORD=${{ secrets.E2E_CREATOR_PASSWORD }}"
            echo "E2E_AUTH_PROVIDER=betterauth"
            echo "E2E_PERF_FORM_ID=${{ vars.E2E_PERF_FORM_ID }}"
            echo "E2E_PERF_COURSE_ID=${{ vars.E2E_PERF_COURSE_ID }}"
            echo "E2E_PERF_LESSON_ID=${{ vars.E2E_PERF_LESSON_ID }}"
            echo "E2E_VISUAL_FORMS=${{ vars.E2E_VISUAL_FORMS }}"
          } >> "$GITHUB_ENV"

      - name: Fetch baseline
        if: env.MODE == 'compare'
        run: |
          # The newest successful main run that recorded this suite's baseline.
          for run_id in $(gh run list --workflow visual.yml --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run_id" --name "visual-baseline-$SUITE" --dir tests/visual/__screenshots__ 2>/dev/null; then
              echo "Comparing with the baseline from run $run_id." >> "$GITHUB_STEP_SUMMARY"
              echo "BASELINE=1" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No baseline yet: this run records one instead of comparing." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare
        id: compare
        if: env.MODE == 'compare' && env.BASELINE == '1'
        run: pnpm exec playwright test -c playwright.visual.config.ts

      - name: Record
        if: env.MODE == 'record' || env.BASELINE != '1'
        run: pnpm exec playwright test -c playwright.visual.config.ts --update-snapshots=all
        env:
          VISUAL_RECORD: "1"

      # A passing compare re-uploads the same images so the baseline never ages out.
      - name: Upload baseline
        if: github.ref == 'refs/heads/main' && (env.MODE == 'record' || env.BASELINE != '1' || steps.compare.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baseline-${{ env.SUITE }}
          path: tests/visual/__screenshots__
          retention-days: 90

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-report-${{ env.SUITE }}
          path: |
            playwright-report/visual
            test-results
          retention-days: 14
