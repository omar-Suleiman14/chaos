name: Core E2E smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Creator and respondent smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_CONVEX_ENV: ${{ secrets.E2E_CONVEX_ENV }}
      E2E_CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
      E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
      E2E_AUTH_PROVIDER: ${{ vars.E2E_AUTH_PROVIDER || 'clerk' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run core smoke
        run: pnpm test:e2e -- tests/e2e/core-production-smoke.spec.ts

      - name: Run archive navigation smoke
        run: pnpm test:e2e -- tests/e2e/archive-navigation-smoke.spec.ts
