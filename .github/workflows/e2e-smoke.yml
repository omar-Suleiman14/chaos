name: Core E2E smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Creator and respondent smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_CONVEX_ENV: ${{ secrets.E2E_CONVEX_ENV }}
      E2E_CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
      E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run core smoke
        run: pnpm test:e2e -- tests/e2e/core-production-smoke.spec.ts
