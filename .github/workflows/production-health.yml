name: Production health

# Once a day: real-user journey p50/p75/p95 and exceptions from PostHog, and
# the platform status feed, against perf/production-thresholds.json. A crossed
# threshold opens one issue labelled production-health (or comments on it);
# the next healthy day closes it. Thresholds decide; no model runs here.
on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  health:
    name: Telemetry thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      CONVEX_SITE_URL: ${{ vars.PRODUCTION_CONVEX_SITE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Telemetry configured
        id: env
        run: |
          if [ -z "$POSTHOG_PERSONAL_API_KEY" ] || [ -z "$POSTHOG_PROJECT_ID" ]; then
            echo "PostHog API access is not configured: skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.env.outputs.ready == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        if: steps.env.outputs.ready == 'true'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.10.1

      - name: Setup Node
        if: steps.env.outputs.ready == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: steps.env.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check thresholds
        id: check
        if: steps.env.outputs.ready == 'true'
        run: pnpm health:production
        continue-on-error: true

      - name: Summary
        if: always() && steps.env.outputs.ready == 'true'
        run: cat perf/results/production-health.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open or close the issue
        if: always() && steps.env.outputs.ready == 'true'
        run: >
          pnpm exec tsx scripts/check-report.ts --key production-health
          --title "Production health threshold crossed" --label production-health
          --failed "${{ steps.check.outcome == 'failure' }}"
          --body-file perf/results/production-health.md

      - name: Upload results
        if: always() && steps.env.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-health
          path: perf/results/production-health.*
          retention-days: 90
