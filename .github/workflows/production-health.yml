name: Production health

# Manual until Chaos has enough traffic for continuous telemetry monitoring to
# be worth the CI noise and issue automation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  health:
    name: Telemetry thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      CONVEX_SITE_URL: ${{ vars.PRODUCTION_CONVEX_SITE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Telemetry configured
        id: env
        run: |
          if [ -z "$POSTHOG_PERSONAL_API_KEY" ] || [ -z "$POSTHOG_PROJECT_ID" ]; then
            echo "PostHog API access is not configured: skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.env.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        if: steps.env.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Setup Node
        if: steps.env.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: steps.env.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check thresholds
        id: check
        if: steps.env.outputs.ready == 'true'
        run: pnpm health:production
        continue-on-error: true

      - name: Summary
        if: always() && steps.env.outputs.ready == 'true'
        run: cat perf/results/production-health.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open or close the issue
        if: always() && steps.env.outputs.ready == 'true'
        run: >
          pnpm exec tsx scripts/check-report.ts --key production-health
          --title "Production health threshold crossed" --label production-health
          --failed "${{ steps.check.outcome == 'failure' }}"
          --body-file perf/results/production-health.md

      - name: Upload results
        if: always() && steps.env.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-health
          path: perf/results/production-health.*
          retention-days: 30
