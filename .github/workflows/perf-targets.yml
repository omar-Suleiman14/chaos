name: Optimisation targets

# On demand: one standing "Optimise: <journey>" issue per journey (label
# perf-target) with its current budgets and a measurable target, ready to hand
# to an agent. Rerunning comments the latest numbers on the open issue instead
# of duplicating it.
on:
  workflow_dispatch:
    inputs:
      journeys:
        description: "Comma-separated journeys (dashboard, form-editor, quiz, lesson, course, live, card, mcp, styles); empty for all"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  targets:
    name: Optimisation issue per journey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      JOURNEYS: ${{ inputs.journeys }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open or refresh the issues
        run: pnpm exec tsx scripts/perf-issues.ts targets ${JOURNEYS:+--journeys "$JOURNEYS"}
