name: Performance budgets

on:
  push:
    branches: [main, e2e]
  pull_request:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budgets:
    name: Convex, render and bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Measurements first; the ratchet below fails the job if any suite failed,
      # so a broken benchmark can never pass as "no regression".
      - name: Measure Convex reads and client rendering
        run: pnpm perf
        continue-on-error: true

      - name: Measure stylesheet costs
        run: pnpm perf:css
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://ci-placeholder.convex.cloud"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k"
          CLERK_SECRET_KEY: "sk_test_ci-placeholder-not-a-real-credential"

      - name: Measure bundles
        run: pnpm perf:bundles

      - name: Compare with budgets
        run: pnpm perf:check

      - name: Summary
        if: always()
        run: cat perf/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-results
          path: perf/results
          retention-days: 30
