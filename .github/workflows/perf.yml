name: Performance

# Expensive performance work is manual. Choose deterministic budgets, real
# browser journeys, or both when a change actually needs performance evidence.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: What to run
        type: choice
        options: [budgets, browser, all]
        default: budgets
      runs:
        description: Browser samples per journey
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budgets:
    name: Deterministic budgets
    if: inputs.suite == 'budgets' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.10.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Correctness checks
        run: pnpm test:correctness
        continue-on-error: true

      - name: Measure Convex reads and client rendering
        run: pnpm perf
        continue-on-error: true

      - name: Measure stylesheet costs
        run: pnpm perf:css
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://ci-placeholder.convex.cloud"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k"
          CLERK_SECRET_KEY: "sk_test_ci-placeholder-not-a-real-credential"

      - name: Measure bundles
        run: pnpm perf:bundles

      - name: Compare with budgets
        run: pnpm perf:check

      - name: Summary
        if: always()
        run: cat perf/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Comment on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then echo "No open pull request for $BRANCH."; exit 0; fi
          pnpm exec tsx scripts/perf-pr-summary.ts > /dev/null
          existing=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- chaos-perf-summary -->")) | .id' | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@perf/results/pr-comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file perf/results/pr-comment.md
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-results
          path: perf/results
          retention-days: 14

  browser:
    name: Browser journeys and render health
    if: inputs.suite == 'browser' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_CONVEX_ENV: ${{ secrets.E2E_CONVEX_ENV }}
      E2E_CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
      E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
      E2E_AUTH_PROVIDER: ${{ vars.E2E_AUTH_PROVIDER || 'clerk' }}
      E2E_PERF_FORM_ID: ${{ vars.E2E_PERF_FORM_ID }}
      E2E_PERF_COURSE_ID: ${{ vars.E2E_PERF_COURSE_ID }}
      E2E_PERF_LESSON_ID: ${{ vars.E2E_PERF_LESSON_ID }}
      E2E_PERF_GIANT_LESSON_ID: ${{ vars.E2E_PERF_GIANT_LESSON_ID }}
      E2E_PERF_QUIZ_SHARE_ID: ${{ vars.E2E_PERF_QUIZ_SHARE_ID }}
      E2E_PERF_LIVE_PIN: ${{ vars.E2E_PERF_LIVE_PIN }}
      E2E_PERF_LARGE_FORM_ID: ${{ vars.E2E_PERF_LARGE_FORM_ID }}
      PERF_RUNS: ${{ inputs.runs }}
      PERF_RENDER_RUNS: "3"
    steps:
      - name: Verify E2E environment
        run: |
          [ -n "$PLAYWRIGHT_BASE_URL" ] || { echo "Set E2E_BASE_URL before running browser performance."; exit 1; }

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.10.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Measure journeys and render health
        run: pnpm exec playwright test -c playwright.perf.config.ts

      - name: Compare with budgets
        if: always()
        run: pnpm perf:check -- --suites journeys-browser,keystroke-browser,render-browser,idle-browser,memory-browser --allow-new

      - name: Summary
        if: always()
        run: cat perf/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-browser-results
          path: |
            perf/results
            test-results
          retention-days: 14
